name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/shared-models/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/shared-models/**'

jobs:
  lint-build-test:
    name: Build & Test (Ktor API)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run shared-models tests
        run: ./gradlew :packages:shared-models:test

      - name: Run API tests
        run: ./gradlew :services:api:test
        env:
          DATABASE_URL: "jdbc:postgresql://localhost:5432/whatssyntax_test"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test-secret-ci"
          DEV_OTP_BYPASS: "123456"

      - name: Build API distribution
        run: ./gradlew :services:api:installDist

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: whatssyntax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
