ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.whatssyntax.api.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/whatssyntax"
    url = ${?DATABASE_URL}
    driver = "org.postgresql.Driver"
    maxPoolSize = 10
}

redis {
    url = "redis://localhost:6379"
    url = ${?REDIS_URL}
}

jwt {
    secret = "dev-secret-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "whatssyntax-api"
    audience = "whatssyntax-android"
    accessTokenExpiryMinutes = 15
    refreshTokenExpiryDays = 30
}

otp {
    # Set to a fixed code in dev/test to skip SMS sending
    devBypassCode = "123456"
    devBypassCode = ${?DEV_OTP_BYPASS}
}
